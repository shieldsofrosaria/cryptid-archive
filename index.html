<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Research Archive // Cryptid Dossiers</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #161922;
      --border: #282e3d;
      --accent: #d97736;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Grid Gallery */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 1rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      background: rgba(217, 119, 54, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 2px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Dossier Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      max-width: 600px;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
    }

    .modal-content {
      padding: 1.5rem;
    }

    .modal-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .modal-desc {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 1.25rem;
    }

    .close-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>// Field Archive: Cryptid Dossiers</h1>
    <p class="subtitle">UNVERIFIED BIOLOGICAL SPECIMENS & ENCOUNTER EVIDENCE</p>
  </header>

  <main class="grid" id="cryptid-grid"></main>

  <!-- Modal / Case File Popup -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeDossier(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <img id="modal-img" src="" alt="" />
      <div class="modal-content">
        <div class="modal-header">
          <span class="tag" id="modal-tag"></span>
          <h2 id="modal-title" style="margin-top: 4px;"></h2>
          <div class="card-meta" id="modal-site"></div>
        </div>
        <p class="modal-desc" id="modal-desc"></p>
        <button class="close-btn" onclick="closeDossier()">CLOSE DOSSIER</button>
      </div>
    </div>
  </div>

  <script>
    // EDIT YOUR COLLECTION HERE:
    const cryptids = [
      {
        id: "CF-01",
        name: "The Crimson Tangler",
        category: "Carnivorous Flora",
        site: "Site A-1 (Pine Ridge Basin)",
        image: "images/crimson-tangler.jpg", // Path to your saved AI photo
        description: "An arboreal ambush flora displaying mobile root tendrils and spiked maw-like bracts. Appears dormant until organic motion triggers rapid constricting response."
      },
      {
        id: "CE-04",
        name: "Glimmer Hound",
        category: "Close Encounter Entity",
        site: "Site C-7 (Old Quarry Road)",
        image: "images/glimmer-hound.jpg",
        description: "Quadrupedal apparition emitting soft ultraviolet bioluminescence. Leaves no footprint depression despite displacing underbrush."
      }
    ];

    const grid = document.getElementById("cryptid-grid");

    // Render Cards
    cryptids.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "card";
      card.onclick = () => openDossier(index);
      card.innerHTML = `
        <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x250/161922/94a3b8?text=Image+Missing'" />
        <div class="card-body">
          <span class="tag">${item.category}</span>
          <div class="card-title">${item.name}</div>
          <div class="card-meta">${item.site}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function openDossier(index) {
      const item = cryptids[index];
      document.getElementById("modal-img").src = item.image;
      document.getElementById("modal-tag").textContent = item.category + " // " + item.id;
      document.getElementById("modal-title").textContent = item.name;
      document.getElementById("modal-site").textContent = "Location: " + item.site;
      document.getElementById("modal-desc").textContent = item.description;
      document.getElementById("modal-overlay").classList.add("active");
    }

    function closeDossier(event) {
      document.getElementById("modal-overlay").classList.remove("active");
    }
  </script>
</body>
</html>
